<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background Circle -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Circle Background -->
  <circle cx="200" cy="200" r="195" fill="#1a1a1a" stroke="url(#goldGradient)" stroke-width="3"/>
  
  <!-- Inner Circle -->
  <circle cx="200" cy="200" r="180" fill="#f5f3f0"/>
  
  <!-- Decorative Top Elements -->
  <path d="M 140 80 Q 200 60 260 80" stroke="#d4af37" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="70" r="3" fill="#d4af37"/>
  <circle cx="200" cy="60" r="3" fill="#d4af37"/>
  <circle cx="230" cy="70" r="3" fill="#d4af37"/>
  
  <!-- Main Broom/Sparkle Element -->
  <g filter="url(#shadow)">
    <!-- Broom Handle -->
    <line x1="200" y1="120" x2="200" y2="240" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Broom Bristles -->
    <ellipse cx="200" cy="260" rx="35" ry="20" fill="#d4af37" opacity="0.8"/>
    <path d="M 180 260 Q 175 275 170 285" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 190 265 Q 185 280 180 292" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 200 268 Q 200 285 200 300" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 210 265 Q 215 280 220 292" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 220 260 Q 225 275 230 285" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Sparkle Stars Around Broom -->
  <g fill="#d4af37">
    <!-- Top Left Star -->
    <path d="M 120 140 L 125 150 L 135 155 L 125 160 L 120 170 L 115 160 L 105 155 L 115 150 Z"/>
    
    <!-- Top Right Star -->
    <path d="M 280 140 L 285 150 L 295 155 L 285 160 L 280 170 L 275 160 L 265 155 L 275 150 Z"/>
    
    <!-- Bottom Right Star -->
    <path d="M 270 240 L 273 248 L 282 252 L 273 256 L 270 265 L 267 256 L 258 252 L 267 248 Z"/>
    
    <!-- Bottom Left Star -->
    <path d="M 130 240 L 133 248 L 142 252 L 133 256 L 130 265 L 127 256 L 118 252 L 127 248 Z"/>
  </g>
  
  <!-- Small Sparkles -->
  <circle cx="145" cy="110" r="2" fill="#d4af37"/>
  <circle cx="255" cy="110" r="2" fill="#d4af37"/>
  <circle cx="155" cy="310" r="2" fill="#d4af37"/>
  <circle cx="245" cy="310" r="2" fill="#d4af37"/>
  
  <!-- Company Name Text -->
  <text x="200" y="340" font-family="Playfair Display, Georgia, serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" letter-spacing="2">
    TOTAL CLEAN
  </text>
  
  <!-- Tagline Text -->
  <text x="200" y="360" font-family="Lato, sans-serif" font-size="11" text-anchor="middle" fill="#d4af37" letter-spacing="1">
    LUXURY CLEANING
  </text>
  
  <!-- Decorative Bottom Line -->
  <line x1="130" y1="375" x2="270" y2="375" stroke="url(#goldGradient)" stroke-width="1"/>
</svg>
